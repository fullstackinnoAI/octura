<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Octura 双语重点区域对照</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #160a32; color: #fff; font-family: "PingFang SC", Arial, sans-serif; }
      main { width: 1029px; height: 500px; padding: 22px; display: grid; grid-template-rows: 42px 1fr; gap: 12px; }
      h1 { margin: 0; font-size: 19px; }
      section { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-height: 0; }
      article { position: relative; overflow: hidden; border: 1px solid #4c3171; border-radius: 14px; background: #f8f5fb; }
      .label { position: absolute; z-index: 2; top: 12px; left: 12px; padding: 6px 9px; border-radius: 999px; background: rgba(35,13,74,.9); font-size: 10px; font-weight: 700; }
      img { position: absolute; width: 615px; max-width: none; height: auto; left: -125px; top: 0; }
      .caption { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.95); color: #503c66; font-size: 10px; }
    </style>
  </head>
  <body>
    <main>
      <h1>重点区域：语言开关、Hero、指标与筛选</h1>
      <section>
        <article><span class="label">中文</span><img src="octura-bilingual-zh.png" alt="中文重点区域" /><div class="caption">中文短标签保持紧凑的信息密度。</div></article>
        <article><span class="label">English</span><img src="octura-bilingual-en.png" alt="英文重点区域" /><div class="caption">英文长标签未造成挤压、截断或主按钮换行。</div></article>
      </section>
    </main>
  </body>
</html>
