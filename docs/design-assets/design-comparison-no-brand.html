<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Octura 去品牌露出设计对照</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #160a32; color: #fff; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
      main { width: 1029px; height: 747px; padding: 22px; display: grid; grid-template-rows: 48px 1fr; gap: 12px; }
      header { display: flex; align-items: center; justify-content: space-between; }
      h1 { margin: 0; font-size: 20px; }
      header p { margin: 0; color: #b8a5d2; font-size: 11px; }
      section { min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      article { position: relative; min-width: 0; overflow: hidden; border: 1px solid #4c3171; border-radius: 14px; background: #f8f5fb; }
      .label { position: absolute; z-index: 2; top: 12px; left: 12px; padding: 6px 9px; border-radius: 999px; background: rgba(35,13,74,.9); font-size: 10px; font-weight: 700; }
      img { width: 100%; height: auto; object-fit: contain; object-position: top center; }
      .note { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 9px 10px; border-radius: 9px; background: rgba(255,255,255,.94); color: #4e3b64; font-size: 10px; line-height: 1.45; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Octura · 去品牌露出视觉对照</h1>
        <p>保留颜色和风格，移除署名、IP 与品牌专属图标</p>
      </header>
      <section>
        <article>
          <span class="label">调整前</span>
          <img src="octura-fullstack-cn-viewport.png" alt="带品牌元素的 Octura 工作台" />
          <div class="note">设计语言：紫橙、浅紫画布、深紫导航、柔和卡片；品牌露出：署名、IP 章鱼、专属 3D 图标。</div>
        </article>
        <article>
          <span class="label">调整后</span>
          <img src="octura-purple-orange-no-brand.png" alt="不含外部品牌露出的 Octura 工作台" />
          <div class="note">保留色板、间距、圆角、状态色和信息层级；只呈现 Octura 自有名称与产品内容。</div>
        </article>
      </section>
    </main>
  </body>
</html>
