name: octura

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: octura
      POSTGRES_PASSWORD: octura
      POSTGRES_DB: octura
    volumes:
      - octura_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octura -d octura"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  octura:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://octura:octura@db:5432/octura
      OCTURA_API_URL: http://localhost:3000
      PORT: 3000
    ports:
      - "${OCTURA_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    restart: unless-stopped

volumes:
  octura_data:
